<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd" lang="en">
<html lang="en">

<head>
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Type" content="text/html charset=UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    @media (prefers-color-scheme: light) {
      body.email-body,
      table.centerer,
      table.wrapper {
        background-color: #FFFFFF !important;
        color: #FFFFFF !important;
      }

      table.card {
        background-color: #5BA3D0 !important;
      }

      span.shoutout {
        color: #E0F2F7 !important;
      }

      td.primary,
      td.primary a,
      td.primary span {
        background-color: #4A92B8 !important;
        color: #ffffff !important;
      }

      td.secondary,
      td.secondary a,
      td.secondary span {
        background-color: #C5E3F6 !important;
        color: #1E5A7A !important;
      }

      td.notice {
        color: #4A92B8 !important;
      }

      td.notice a {
        color: #2E6FA6 !important;
      }

      img.logo {
        content: url("https://cdn.samtendo.net/images/NewSamtendoCircle.png") !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      body.email-body,
      table.centerer,
      table.wrapper {
        background-color: #1A2A3A !important;
        color: #FFFFFF !important;
      }

      table.card {
        background-color: #2B4A64 !important;
      }

      span.shoutout {
        color: #A8D5F7 !important;
      }

      td.primary,
      td.primary a,
      td.primary span {
        background-color: #5BA3D0 !important;
        color: #ffffff !important;
      }

      td.secondary,
      td.secondary a,
      td.secondary span {
        background-color: #3D5F80 !important;
        color: #E0F2F7 !important;
      }

      td.notice {
        color: #7FBDE8 !important;
      }

      td.notice a {
        color: #A8D5F7 !important;
      }

      img.logo {
        content: url("https://cdn.samtendo.net/images/NewSamtendoCircle.png") !important;
      }
    }

    td.button a,
    td.button span,
    u+.email-body td.button a,
    u+.email-body td.button span {
      text-decoration: none !important;
    }

    u+.email-body,
    u+.email-body table.centerer,
    u+.email-body table.wrapper {
      background-color: #1A2A3A !important;
      background-image: linear-gradient(#1A2A3A, #1A2A3A) !important;
      color: #fff !important;
    }

    u+.email-body table.card {
      background-color: #2B4A64 !important;
      background-image: linear-gradient(#2B4A64, #2B4A64) !important;
    }

    u+.email-body span.shoutout {
      color: #A8D5F7 !important;
    }

    u+.email-body td {
      color: #fff !important;
    }

    u+.email-body td a {
      color: #fff !important;
      font-weight: 700 !important;
      text-decoration: underline !important;
    }

    u+.email-body td.primary,
    u+.email-body td.primary a,
    u+.email-body td.primary span {
      background-color: #5BA3D0 !important;
      background-image: linear-gradient(#5BA3D0, #5BA3D0) !important;
      color: #fff !important;
    }

    u+.email-body td.secondary,
    u+.email-body td.secondary a,
    u+.email-body td.secondary span {
      background-color: #3D5F80 !important;
      background-image: linear-gradient(#3D5F80, #3D5F80) !important;
      color: #fff !important;
    }

    u+.email-body td.notice {
      color: #fff !important;
    }

    u+.email-body td.notice a {
      color: #fff !important;
      font-weight: 700 !important;
    }

    u+.email-body .gmail-s {
      background: #000 !important;
      mix-blend-mode: screen !important;
    }

    u+.email-body .gmail-d {
      background: #000 !important;
      mix-blend-mode: difference !important;
    }
  </style>
</head>

<body class="email-body" bgcolor="#1A2A3A"
  style="margin-left:0;margin-right:0;margin-top:0;margin-bottom:0;padding-left:0;padding-right:0;padding-top:0;padding-bottom:0;font-family:Poppins, Arial, Helvetica, sans-serif;color:#FFFFFF">

  <div style="display:none;"><!--plainText--></div>

  <table class="centerer" bgcolor="#1A2A3A" border="0" cellpadding="0" cellspacing="0" height="100%" width="100%"
    style="max-width:100%;">
    <tr>
      <td align="center">
        <table class="wrapper" bgcolor="#1A2A3A" style="font-family:Poppins, Arial, Helvetica, sans-serif;" border="0"
          cellpadding="0" cellspacing="0" height="100%" width="420px">
          <tr>
            <td>
              <table border="0" cellpadding="0" cellspacing="0" height="100%" width="100%">
                <tr>
                  <td width="32px">&nbsp;</td>
                  <td>
                    <table border="0" cellpadding="0" cellspacing="0" height="100%" width="100%">
                      <tr>
                        <td height="36px" style="line-height:36px;" width="100%">&nbsp;</td>
                      </tr>
                      <tr>
                        <td>
                          <table border="0" cellpadding="0" cellspacing="0" height="100%" width="100%">
                            <tr>
                              <td>
                                <a href="https://samtendo.net">
                                  <img class="logo" width="auto" height="48px" src="https://cdn.samtendo.net/images/NewSamtendoCircle.png" alt="Samtendo">
                                </a>
                              </td>
                            </tr>
                            <tr>
                              <td width="100%" height="36px" style="line-height:36px;">&nbsp;</td>
                            </tr>
                            <tr>
                              <td>
                                <table class="card" bgcolor="#2B4A64" style="color:#ffffff;border-radius:10px;" border="0" cellpadding="0" cellspacing="0" height="100%" width="100%">
                                  <tr>
                                    <td width="24px" height="100%">&nbsp;</td>
                                    <td>
                                      <table border="0" cellpadding="0" cellspacing="0" height="100%" width="100%">

                                        <!--innerHTML-->

                                        <tr>
                                          <td width="100%" height="36px" style="line-height:36px;">&nbsp;</td>
                                        </tr>

                                        <tr>
                                          <td align="right" class="signature">The Samtendo Network team</td>
                                        </tr>

                                        <tr>
                                          <td width="100%" height="24px" style="line-height:24px;">&nbsp;</td>
                                        </tr>
                                      </table>
                                    </td>
                                    <td width="24px" height="100%">&nbsp;</td>
                                  </tr>
                                </table>
                              </td>
                            </tr>
                            <tr>
                              <td width="100%" height="18px" style="line-height:18px;">&nbsp;</td>
                            </tr>
                            <tr>
                              <td class="notice" style="color:#7FBDE8;font-size:12px;">
                                Note: this email message was auto-generated, please do not respond. For further assistance, please join our <a href="https://discord.samtendo.net" style="text-decoration:none;color:#A8D5F7;">Discord server</a>.
                              </td>
                            </tr>
                            <tr>
                              <td width="100%" height="48px" style="line-height:48px;">&nbsp;</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td width="32px">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>

</html>
